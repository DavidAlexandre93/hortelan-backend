[project]
name = "hortelan-backend"
version = "1.0.0"
description = "API Hortelan com FastAPI e arquitetura hexagonal"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
authors = [{ name = "Hortelan Team" }]
dependencies = [
  "aiokafka==0.14.0",
  "aiosqlite==0.22.1",
  "boto3==1.43.76",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "pydantic-settings==2.15.0",
  "pymongo==4.17.0",
  "redis==8.1.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
  "web3==7.16.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[build-system]
requires = ["poetry-core>=2.3.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "app" },
  { include = "api" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-config --strict-markers"
markers = [
  "integration: testes que exercitam multiplas camadas",
]
filterwarnings = [
  "error",
  "ignore:websockets.legacy is deprecated:DeprecationWarning:websockets.legacy",
]

[tool.coverage.run]
branch = true
source = ["app", "api", "scripts"]
omit = ["app/api/schemas.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@abstractmethod",
  '\.\.\.',
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", "openspec/changes/archive"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.11"
files = ["app", "api", "scripts"]
strict = true
show_error_codes = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
