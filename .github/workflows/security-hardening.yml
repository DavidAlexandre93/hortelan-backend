name: Security Hardening

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "master", "develop"]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check dependency graph availability
        id: depgraph
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.get({ owner, repo });
            const depGraph = response.data.security_and_analysis?.dependency_graph?.status;
            const supported = depGraph === 'enabled';
            core.setOutput('supported', supported ? 'true' : 'false');
            if (!supported) {
              core.notice('Dependency graph is not enabled. Skipping dependency-review-action to avoid failing CI.');
            }

      - name: Dependency review
        if: steps.depgraph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: Dependency review skipped
        if: steps.depgraph.outputs.supported != 'true'
        run: echo "Dependency graph not enabled in repository settings. Skipping dependency review for this PR."

  sast-codeql:
    name: CodeQL SAST (python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
