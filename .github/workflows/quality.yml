name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/check_conventional_commits.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: OpenSpec strict
        run: npx --yes @fission-ai/openspec@1.10.0 validate --all --strict --no-interactive
      - name: Static quality
        run: |
          ruff check app api scripts tests
          ruff format --check app api scripts tests
          mypy app api scripts
          bandit -q -r app api scripts
      - name: OpenAPI drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json
      - name: Tests and coverage
        run: pytest -q --cov=app --cov=api --cov=scripts --cov-report=term-missing --cov-report=xml
      - name: Dependency audit
        run: pip-audit --local --skip-editable --progress-spinner off
      - name: Docker build
        run: docker build --tag hortelan-backend:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore
